version: '2'
linters:
  default: standard
  enable:
    - errorlint
    - gosec
    - revive
    - unconvert
    - unparam
    - wrapcheck
  settings:
    wrapcheck:
      ignore-sigs:
        - fmt.Errorf(
        - errors.New(
        - errors.Join(
      # Errors from our own packages already carry context.
      ignore-package-globs:
        - github.com/FlyToRakib/vdeploy/agent/*
formatters:
  enable:
    - gofmt
