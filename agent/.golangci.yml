version: '2'
linters:
  default: standard
  enable:
    - errorlint
    - gosec
    - revive
    - unconvert
    - unparam
    - wrapcheck
  settings:
    wrapcheck:
      ignore-sigs:
        - fmt.Errorf(
        - errors.New(
        - errors.Join(
      # Errors from our own packages already carry context.
      ignore-package-globs:
        - github.com/FlyToRakib/vdeploy/agent/*
  exclusions:
    rules:
      # Tests assert on errors directly; wrapping them would only add noise.
      - path: _test\.go
        linters:
          - wrapcheck
formatters:
  enable:
    - gofmt
